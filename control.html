0<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Fire Academy - لوحة التحكم والسيطرة</title>
    <!-- استيراد خط نسخ فخم ومريح (Amiri) -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- استيراد مكتبات Firebase عبر CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Amiri", "Traditional Arabic", "Tahoma", serif;
        }
        body {
            background-color: #0b0f19;
            color: #cbd5e1;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }
        .container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            background: #111827;
            padding: 25px;
            border-radius: 0;
            box-shadow: none;
            border: none;
            border-bottom: 1px solid #1f2937;
            position: relative;
            flex: 1;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h2 { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 700;
            margin: 0;
        }
        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            width: auto;
            padding: 10px 18px;
            font-size: 15px;
            margin: 0;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .logout-btn:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }

        .form-section, .search-section, .settings-section, .stats-section, .lessons-shortcut-section {
            background: #1f2937;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 22px;
            border: 1px solid #374151;
        }
        .search-section { background: #0f172a; border-color: #1e293b; }
        .settings-section { background: #182235; border-color: #ff6b00; border-width: 1.5px; }
        .lessons-shortcut-section { background: #0f172a; border-color: #38bdf8; border-width: 1.5px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .stats-section { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border-color: #1e293b; font-size: 16px; font-weight: bold; color: #38bdf8; flex-wrap: wrap; gap: 10px; }
        
        .form-group { margin-bottom: 18px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 700; 
            font-size: 15px; 
            color: #d1d5db;
        }
        input, select, button {
            width: 100%;
            padding: 14px;
            border: 1px solid #374151;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #030712;
            color: #fff;
            outline: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        input:disabled, select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #111827;
        }
        input:focus, select:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
        }
        button {
            background: linear-gradient(135deg, #ff6b00, #e65c00);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.2s ease;
            font-size: 17px;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }
        button:hover { 
            background: linear-gradient(135deg, #e65c00, #cc5200); 
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        .lessons-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #000;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            display: inline-block;
            text-align: center;
            width: auto;
            margin: 0;
            transition: all 0.2s ease;
        }
        .lessons-btn:hover { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; }

        .name-list {
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            margin-top: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        .name-item {
            padding: 12px 16px;
            border-bottom: 1px solid #1f2937;
            cursor: pointer;
            font-size: 15px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s ease;
            flex-wrap: wrap;
            gap: 5px;
        }
        .name-item:last-child { border-bottom: none; }
        .name-item:hover { background-color: #1e293b; color: #ff6b00; font-weight: bold; }
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 18px;
        }
        .edit-mode-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2); }
        .edit-mode-btn:hover { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
        .delete-mode-btn { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
        .delete-mode-btn:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .new-mode-btn { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .new-mode-btn:hover { background: linear-gradient(135deg, #059669, #047857); }

        /* التوست للتنبيهات العائمة */
        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1f2937;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #374151;
            font-size: 15px;
            font-weight: 700;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: center;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        #toast.success { border-color: #10b981; background: #064e3b; color: #a7f3d0; }
        #toast.error { border-color: #ef4444; background: #7f1d1d; color: #fecaca; }
        #toast.info { border-color: #3b82f6; background: #1e3a8a; color: #bfdbfe; }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .action-buttons { grid-template-columns: 1fr; }
            h2 { font-size: 22px; }
        }
    </style>

    <meta name="theme-color" content="#ff6b00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="app-icon.svg">
    <link rel="stylesheet" href="app-enhancements.css">
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>On Fire Academy - لوحة التحكم</h2>
        <button id="logoutBtn" class="logout-btn">🚪 تسجيل خروج</button>
    </div>

    <!-- الإحصائيات -->
    <div class="stats-section">
        <span id="totalStudentsCount">📊 إجمالي الطلاب جاري التحميل...</span>
        <button id="refreshBtn" style="width: auto; padding: 8px 16px; font-size: 14px; margin:0;">🔄 تحديث</button>
    </div>

    <!-- اختصار الانتقال لإدارة وإضافة الدروس -->
    <div class="lessons-shortcut-section">
        <div>
            <span style="font-weight: bold; color: #ffffff; display: block; font-size: 16px;">📚 إدارة وإضافة الدروس</span>
            <span style="color: #94a3b8; font-size: 13px;">إضافة وتعديل وحذف الحصص والفيديوهات للمدرسين</span>
        </div>
        <a href="add-lesson.html" class="lessons-btn">إدارة الدروس 🚀</a>
    </div>

    <!-- البحث الفوري -->
    <div class="search-section">
        <label>🔍 بحث سريع (بالاسم أو الكود)</label>
        <input type="text" id="searchInput" placeholder="اكتب للبحث..." autocomplete="off">
        <div id="nameListContainer" class="name-list" style="display: none;"></div>
    </div>

    <!-- نموذج بيانات الطالب -->
    <div class="form-section">
        <input type="hidden" id="originalCode" value="">
        <div class="form-group">
            <label>اسم الطالب</label>
            <input type="text" id="studentNameInput" placeholder="أدخل اسم الطالب..." autocomplete="off">
        </div>
        <div class="form-group">
            <label>البريد الإلكتروني (الـ Gmail)</label>
            <input type="text" id="codeInput" placeholder="أدخل البريد الإلكتروني (الـ Gmail)..." maxlength="8" autocomplete="off">
        </div>
        <!-- حقل كلمة المرور الخاصة بالكود -->
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="text" id="passwordInput" placeholder="أدخل كلمة المرور..." maxlength="8" autocomplete="off">
        </div>
        <div class="form-group">
            <label>المرحلة الدراسية</label>
            <select id="gradeSelect">
                <option value="أولى إعدادي">أولى إعدادي</option>
                <option value="ثانية إعدادي">ثانية إعدادي</option>
                <option value="ثالثة إعدادي">ثالثة إعدادي</option>
                <option value="أولى ثانوي">أولى ثانوي</option>
                <option value="ثانية ثانوي">ثانية ثانوي</option>
                <option value="ثالثة ثانوي">ثالثة ثانوي</option>
            </select>
        </div>
        <div class="form-group">
            <label>حالة الاشتراك / الكود</label>
            <select id="statusSelect">
                <option value="active">🟢 يعمل (تم الدفع)</option>
                <option value="inactive">🔴 متوقف (لم يدفع الاشتراك)</option>
            </select>
        </div>

        <!-- أزرار التحكم -->
        <div id="defaultAddBtnContainer">
            <button id="addStudentBtn">إضافة طالب جديد 🚀</button>
        </div>

        <div id="selectedStudentActions" class="action-buttons" style="display: none;">
            <button id="editBtn" class="edit-mode-btn">تعديل</button>
            <button id="deleteBtn" class="delete-mode-btn">حذف</button>
            <button id="resetBtn" class="new-mode-btn">إضافة جديد</button>
        </div>
    </div>
</div>

<!-- عنصر التنبيهات العائمة Toast -->
<div id="toast"></div>

<script>
    const firebaseConfig = {
    apiKey: "AIzaSyDjrZpDkDXefngDEmQv43oB6xG38WKkwac",
    authDomain: "doshas-e5d12.firebaseapp.com",
    databaseURL: "https://doshas-e5d12-default-rtdb.firebaseio.com",
    projectId: "doshas-e5d12",
    storageBucket: "doshas-e5d12.firebasestorage.app",
    messagingSenderId: "1005308467875",
    appId: "1:1005308467875:web:7de501912aa760024dbd16",
    measurementId: "G-CRXBZTTB83"
};
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const auth = firebase.auth();
    const ADMIN_EMAIL = "ofire8000@gmail.com".toLowerCase();

    let allStudentsCache = [];

    // دالة لعرض التنبيهات العائمة (Toast)
    function showToast(message, type = 'info') {
        const toast = document.getElementById("toast");
        toast.className = `show ${type}`;
        toast.innerText = message;
        setTimeout(() => {
            toast.className = toast.className.replace("show", "").trim();
        }, 3200);
    }

    // قيود حقل كود الطالب (أرقام فقط بحد أقصى 8)
    const codeInput = document.getElementById("codeInput");
    codeInput.addEventListener("input", function(e) {
        // السماح بالأرقام فقط وإزالة أي شيء آخر وحجز أول 8 خانات
        let cleaned = this.value.replace(/\D/g, '').slice(0, 8);
        if (this.value !== cleaned) {
            showToast("كود الطالب يقبل الأرقام فقط وبحد أقصى 8 أرقام!", "error");
        }
        this.value = cleaned;
    });

    // قيود حقل كلمة المرور (بحد أقصى 8، ممنوع: الحروف العربية، الشرطة السفلية _، الزائد +, الناقص -)
    const passwordInput = document.getElementById("passwordInput");
    passwordInput.addEventListener("input", function(e) {
        let val = this.value;
        // فحص وجود حروف عربية أو رموز غير مسموحة (_ أو + أو -)
        // نطاق الحروف العربية: [\u0600-\u06FF]
        let arabicRegex = /[\u0600-\u06FF]/;
        let forbiddenSymbols = /[_+\-]/;

        if (arabicRegex.test(val)) {
            showToast("ممنوع استخدام الحروف العربية في كلمة المرور!", "error");
            val = val.replace(/[\u0600-\u06FF]/g, '');
        }
        if (forbiddenSymbols.test(val)) {
            showToast("ممنوع استخدام الرموز (_, +, -) في كلمة المرور!", "error");
            val = val.replace(/[_+\-]/g, '');
        }

        // قص النص ليصبح بحد أقصى 8 خانات
        if (val.length > 8) {
            val = val.slice(0, 8);
            showToast("كلمة المرور بحد أقصى 8 خانات فقط!", "error");
        }

        this.value = val;
    });

    // تحميل البيانات وإحصائيات الطلاب وإعدادات الكنترول
    async function loadData() {
        const countSpan = document.getElementById("totalStudentsCount");
        countSpan.innerText = "📊 جاري تحميل الطلاب...";
        try {
            const snapshot = await db.ref('codes').once('value');
            allStudentsCache = [];
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (let codeKey in data) {
                    let info = data[codeKey];
                    allStudentsCache.push({
                        codeKey: codeKey,
                        studentName: info.studentName || info.name || "بدون اسم",
                        password: info.password || "",
                        grade: info.grade || "أولى إعدادي",
                        status: info.status || "active",
                        deviceId: info.deviceId || null
                    });
                }
            }
            countSpan.innerText = `📊 إجمالي الطلاب المسجلين: ${allStudentsCache.length}`;
        } catch (error) {
            console.error("خطأ في جلب البيانات:", error);
            countSpan.innerText = "📊 خطأ في الاتصال بقاعدة البيانات";
            showToast("تعذر جلب بيانات الطلاب", "error");
        }
    }

    // تسجيل الخروج من Firebase Auth
    async function logoutAdmin() {
        try { await auth.signOut(); } finally { localStorage.removeItem('activeStudentCode'); window.location.replace('index.html'); }
    }

    // البحث الفوري
    function filterData() {
        let query = document.getElementById("searchInput").value.toLowerCase().trim();
        let listContainer = document.getElementById("nameListContainer");

        if (!query) {
            listContainer.style.display = "none";
            listContainer.innerHTML = "";
            return;
        }

        let matched = allStudentsCache.filter(item => 
            item.studentName.toLowerCase().includes(query) || item.codeKey.toLowerCase().includes(query)
        );

        if (matched.length === 0) {
            listContainer.style.display = "block";
            listContainer.innerHTML = '<div style="padding: 12px 16px; color: #ef4444; font-size: 15px; text-align: center;">لا توجد نتائج مطابقة</div>';
            return;
        }

        listContainer.style.display = "block";
        listContainer.innerHTML = "";
        
        matched.forEach(item => {
            let div = document.createElement("div");
            div.className = "name-item";
            let statusText = item.status === 'inactive' ? '🔴 متوقف' : '🟢 يعمل';
            div.innerHTML = `<span>👤 ${item.studentName} <span style="color:#94a3b8; font-size:13px;">(${item.codeKey})</span></span> <span style="color:#38bdf8; font-size:13px;">${item.grade} | ${statusText}</span>`;
            div.onclick = function() {
                selectStudent(item);
            };
            listContainer.appendChild(div);
        });
    }

    // اختيار طالب من القائمة لتعديله أو حذفه
    function selectStudent(item) {
        document.getElementById("studentNameInput").value = item.studentName;
        document.getElementById("codeInput").value = item.codeKey;
        document.getElementById("passwordInput").value = item.password || "";
        document.getElementById("gradeSelect").value = item.grade;
        document.getElementById("statusSelect").value = item.status || "active";
        document.getElementById("originalCode").value = item.codeKey;

        document.getElementById("studentNameInput").disabled = true;
        document.getElementById("codeInput").disabled = true;
        document.getElementById("passwordInput").disabled = true;
        document.getElementById("gradeSelect").disabled = true;
        document.getElementById("statusSelect").disabled = true;

        document.getElementById("defaultAddBtnContainer").style.display = "none";
        document.getElementById("selectedStudentActions").style.display = "grid";
        document.getElementById("nameListContainer").style.display = "none";
        document.getElementById("searchInput").value = "";

        showToast(`تم تحديد الطالب: "${item.studentName}"`, "info");
    }

    // تفعيل وضع التعديل
    function enableEditing() {
        document.getElementById("studentNameInput").disabled = false;
        document.getElementById("codeInput").disabled = false;
        document.getElementById("passwordInput").disabled = false;
        document.getElementById("gradeSelect").disabled = false;
        document.getElementById("statusSelect").disabled = false;

        let actionsDiv = document.getElementById("selectedStudentActions");
        actionsDiv.style.display = "grid";
        actionsDiv.innerHTML = `
            <button id="saveEditBtn" class="new-mode-btn" style="grid-column: span 2;">حفظ التعديلات</button>
            <button id="cancelEditBtn" class="delete-mode-btn">إلغاء</button>
        `;

        document.getElementById("saveEditBtn").onclick = saveEditedStudent;
        document.getElementById("cancelEditBtn").onclick = resetToAddNew;
    }

    // إعادة النماذج لوضع الإضافة الجديدة
    function resetToAddNew() {
        document.getElementById("studentNameInput").value = "";
        document.getElementById("codeInput").value = "";
        document.getElementById("passwordInput").value = "";
        document.getElementById("originalCode").value = "";
        document.getElementById("gradeSelect").value = "أولى إعدادي";
        document.getElementById("statusSelect").value = "active";

        document.getElementById("studentNameInput").disabled = false;
        document.getElementById("codeInput").disabled = false;
        document.getElementById("passwordInput").disabled = false;
        document.getElementById("gradeSelect").disabled = false;
        document.getElementById("statusSelect").disabled = false;

        document.getElementById("defaultAddBtnContainer").style.display = "block";
        document.getElementById("selectedStudentActions").style.display = "none";
        
        document.getElementById("selectedStudentActions").innerHTML = `
            <button id="editBtn" class="edit-mode-btn">تعديل</button>
            <button id="deleteBtn" class="delete-mode-btn">حذف</button>
            <button id="resetBtn" class="new-mode-btn">إضافة جديد</button>
        `;
        bindActionButtons();
    }

    // إضافة طالب جديد
    async function saveNewStudent() {
        const name = document.getElementById("studentNameInput").value.trim();
        const code = document.getElementById("codeInput").value.trim();
        const password = document.getElementById("passwordInput").value.trim();
        const grade = document.getElementById("gradeSelect").value;
        const status = document.getElementById("statusSelect").value;

        if (!name || !code) {
            showToast("الرجاء إدخال اسم الطالب وكود التفعيل!", "error");
            return;
        }

        if (code.length > 8) {
            showToast("كود التفعيل يجب ألا يتجاوز 8 أرقام!", "error");
            return;
        }

        try {
            await db.ref(`codes/${code}`).set({
                studentName: name,
                password: password,
                grade: grade,
                status: status
            });
            showToast("تم إضافة الطالب وتفعيل الكود بنجاح! 🎉", "success");
            resetToAddNew();
            loadData();
        } catch (e) {
            showToast("حدث خطأ أثناء الحفظ في قاعدة البيانات.", "error");
        }
    }

    // حفظ التعديلات
    async function saveEditedStudent() {
        const oldCode = document.getElementById("originalCode").value;
        const name = document.getElementById("studentNameInput").value.trim();
        const newCode = document.getElementById("codeInput").value.trim();
        const password = document.getElementById("passwordInput").value.trim();
        const grade = document.getElementById("gradeSelect").value;
        const status = document.getElementById("statusSelect").value;

        if (!name || !newCode) {
            showToast("الرجاء ملء البيانات المطلوبة!", "error");
            return;
        }

        try {
            if (oldCode !== newCode) {
                await db.ref(`codes/${oldCode}`).remove();
            }

            const oldSnap = await db.ref(`codes/${oldCode}`).once('value');
            let existingDeviceId = null;
            if (oldSnap.exists() && oldSnap.val().deviceId) {
                existingDeviceId = oldSnap.val().deviceId;
            }

            let updateData = {
                studentName: name,
                password: password,
                grade: grade,
                status: status
            };
            if (existingDeviceId) updateData.deviceId = existingDeviceId;

            await db.ref(`codes/${newCode}`).set(updateData);

            showToast("تم تعديل بيانات الطالب بنجاح! ✏️", "success");
            resetToAddNew();
            loadData();
        } catch (e) {
            showToast("حدث خطأ أثناء التعديل.", "error");
        }
    }

    // حذف الطالب
    async function deleteSelectedStudent() {
        const code = document.getElementById("codeInput").value.trim();
        if (confirm("هل أنت متأكد من حذف هذا الطالب وكود التفعيل نهائياً؟")) {
            try {
                await db.ref(`codes/${code}`).remove();
                showToast("تم حذف الطالب بنجاح.", "success");
                resetToAddNew();
                loadData();
            } catch (e) {
                showToast("حدث خطأ أثناء الحذف.", "error");
            }
        }
    }

    // ربط الأحداث بالأزرار بصورة آمنة
    function bindActionButtons() {
        const addBtn = document.getElementById("addStudentBtn");
        if (addBtn) addBtn.onclick = saveNewStudent;

        const editBtn = document.getElementById("editBtn");
        if (editBtn) editBtn.onclick = enableEditing;

        const deleteBtn = document.getElementById("deleteBtn");
        if (deleteBtn) deleteBtn.onclick = deleteSelectedStudent;

        const resetBtn = document.getElementById("resetBtn");
        if (resetBtn) resetBtn.onclick = resetToAddNew;


        const refreshBtn = document.getElementById("refreshBtn");
        if (refreshBtn) refreshBtn.onclick = loadData;

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) logoutBtn.onclick = logoutAdmin;

        const searchInput = document.getElementById("searchInput");
        if (searchInput) searchInput.oninput = filterData;
    }

    window.onload = function() {
        auth.onAuthStateChanged(user => {
            if (!user || (user.email || '').toLowerCase() !== ADMIN_EMAIL) {
                window.location.replace('index.html');
                return;
            }
            loadData();
            bindActionButtons();
        });
    };
</script>

</body>
</html>
